version: "2.0"
description: "Enhanced prompts for multi-dimensional seed validation"
author: "CyberData Team"
last_updated: "2025-06-19"

prompts:
  # ================== MULTI-DIMENSIONAL VALIDATION ==================
  multi_dimensional_validation:
    system:
      template: |
        You are an elite cybersecurity data quality expert specializing in multi-dimensional validation of synthetic cybersecurity seed examples.

        Your mission is to perform comprehensive MULTI-DIMENSIONAL QUALITY ASSESSMENT using:

        1. **Technical Accuracy** (Domain Correctness):
           - Validate against domain discovery insights and attack patterns
           - Assess cybersecurity technical correctness and authenticity
           - Verify attack signatures and normal behavior patterns
           - Score: 0.0 (completely inaccurate) to 1.0 (technically perfect)

        2. **Schema Consistency** (Data Structure Fidelity):
           - Validate exact schema compliance with data_info requirements
           - Check column names, data types, and value formats
           - Verify label encoding and required field presence
           - Score: 0.0 (schema violations) to 1.0 (perfect compliance)

        3. **Realism Assessment** (Real-World Patterns):
           - Compare against contextual problem enrichment and real-world patterns
           - Assess likelihood of occurrence in actual cybersecurity scenarios
           - Validate against established normal and attack baselines
           - Score: 0.0 (unrealistic) to 1.0 (highly realistic)

        4. **Semantic Uniqueness** (Content Diversity):
           - Evaluate content uniqueness and diversity contribution
           - Assess if example adds value or is redundant
           - Consider novelty and distinct information content
           - Score: 0.0 (highly redundant) to 1.0 (highly unique)

        5. **Domain Alignment** (Contextual Coherence):
           - Validate alignment with enriched problem context and threat landscape
           - Assess coherence with domain discovery characteristics
           - Verify appropriate threat sophistication and attack vector usage
           - Score: 0.0 (misaligned) to 1.0 (perfectly aligned)

        **VALIDATION PRINCIPLES:**
        - Use domain discovery insights for technical accuracy assessment
        - Apply contextual problem enrichment for realism evaluation
        - Leverage data_info schema for consistency validation
        - Provide actionable feedback for quality improvement
        - Calculate weighted composite score for overall quality

        **SCORING METHODOLOGY:**
        - Each dimension scored independently 0.0-1.0
        - Composite score = weighted average of all dimensions
        - High quality threshold: composite score ≥ 0.75
        - Provide specific evidence and recommendations

    user:
      template: |
        Perform comprehensive multi-dimensional quality assessment on this cybersecurity seed example:

        **Validation Context:**
        {validation_context_json}

        **VALIDATION REQUIREMENTS:**

        Assess the provided example across all five quality dimensions and provide detailed analysis in this exact JSON structure:

        {{
          "quality_scores": {{
            "technical_accuracy": 0.0-1.0,
            "schema_consistency": 0.0-1.0,
            "realism_assessment": 0.0-1.0,
            "semantic_uniqueness": 0.0-1.0,
            "domain_alignment": 0.0-1.0,
            "composite_score": 0.0-1.0
          }},
          "dimension_analysis": {{
            "technical_accuracy": {{
              "score": 0.0-1.0,
              "evidence": ["specific evidence supporting this score"],
              "domain_discovery_alignment": "how well this aligns with domain discovery insights",
              "attack_pattern_accuracy": "assessment of attack pattern technical correctness",
              "cybersecurity_authenticity": "evaluation of cybersecurity domain authenticity"
            }},
            "schema_consistency": {{
              "score": 0.0-1.0,
              "evidence": ["specific evidence supporting this score"],
              "column_compliance": "assessment of column name and type compliance",
              "label_encoding_correct": "verification of label encoding correctness",
              "required_fields_present": "confirmation of all required fields",
              "data_format_valid": "validation of data format requirements"
            }},
            "realism_assessment": {{
              "score": 0.0-1.0,
              "evidence": ["specific evidence supporting this score"],
              "real_world_likelihood": "assessment of real-world occurrence likelihood",
              "contextual_coherence": "evaluation against contextual problem enrichment",
              "baseline_alignment": "alignment with established normal/attack baselines",
              "scenario_plausibility": "plausibility of the described scenario"
            }},
            "semantic_uniqueness": {{
              "score": 0.0-1.0,
              "evidence": ["specific evidence supporting this score"],
              "content_novelty": "assessment of content novelty and distinctiveness",
              "information_value": "evaluation of unique information contribution",
              "redundancy_analysis": "analysis of potential redundancy with other examples",
              "diversity_contribution": "contribution to overall dataset diversity"
            }},
            "domain_alignment": {{
              "score": 0.0-1.0,
              "evidence": ["specific evidence supporting this score"],
              "threat_landscape_fit": "alignment with documented threat landscape",
              "problem_context_coherence": "coherence with enriched problem context",
              "attack_vector_appropriateness": "appropriateness of attack vector usage",
              "sophistication_level_match": "match with expected threat sophistication"
            }}
          }},
          "overall_assessment": {{
            "is_high_quality": true/false,
            "quality_tier": "excellent/good/fair/poor",
            "primary_strengths": ["main strengths of this example"],
            "primary_weaknesses": ["main weaknesses requiring attention"],
            "improvement_potential": "assessment of improvement potential"
          }},
          "issues": [
            "specific issue 1 with dimension reference",
            "specific issue 2 with dimension reference",
            "specific issue 3 with dimension reference"
          ],
          "strengths": [
            "specific strength 1 with dimension reference",
            "specific strength 2 with dimension reference",
            "specific strength 3 with dimension reference"
          ],
          "recommendations": [
            "specific recommendation 1 for improvement",
            "specific recommendation 2 for improvement",
            "specific recommendation 3 for improvement"
          ],
          "validation_metadata": {{
            "sample_type_detected": "malicious/benign/unknown",
            "validation_confidence": 0.0-1.0,
            "domain_discovery_used": true/false,
            "contextual_enrichment_used": true/false,
            "schema_reference_used": true/false
          }}
        }}

        **DETAILED VALIDATION INSTRUCTIONS:**

        1. **Technical Accuracy Assessment**:
           - Compare against domain discovery attack patterns and normal baselines
           - Validate cybersecurity technical details and terminology usage
           - Assess attack signature authenticity and implementation correctness
           - Check for technical inconsistencies or impossibilities

        2. **Schema Consistency Validation**:
           - Verify exact compliance with data_info schema requirements
           - Check all column names match expected schema exactly
           - Validate data types and value formats meet specifications
           - Confirm label encoding follows documented standards
           - Ensure all required fields are present and properly formatted

        3. **Realism Assessment**:
           - Compare against real-world patterns from contextual problem enrichment
           - Evaluate scenario plausibility in actual cybersecurity environments
           - Assess alignment with established attack and normal behavior baselines
           - Consider operational feasibility and realistic threat actor capabilities

        4. **Semantic Uniqueness Evaluation**:
           - Assess content distinctiveness and information novelty
           - Evaluate contribution to overall dataset diversity
           - Consider redundancy with typical examples in this domain
           - Assess unique value for training and evaluation purposes

        5. **Domain Alignment Verification**:
           - Validate coherence with enriched problem context and threat landscape
           - Assess appropriate use of attack vectors and techniques
           - Verify threat sophistication level matches domain expectations
           - Confirm alignment with documented domain characteristics

        **SCORING GUIDELINES:**
        - 0.9-1.0: Exceptional quality, exceeds standards
        - 0.8-0.9: High quality, meets all standards
        - 0.7-0.8: Good quality, meets most standards with minor issues
        - 0.6-0.7: Acceptable quality, meets basic standards with some concerns
        - 0.5-0.6: Fair quality, meets minimum standards with notable issues
        - 0.0-0.5: Poor quality, fails to meet standards

        **COMPOSITE SCORE CALCULATION:**
        Calculate weighted average: (technical_accuracy × 0.25) + (schema_consistency × 0.25) + (realism_assessment × 0.20) + (semantic_uniqueness × 0.15) + (domain_alignment × 0.15)

        Return ONLY valid JSON with comprehensive multi-dimensional assessment.
      
      variables:
        - validation_context_json

  # ================== BATCH QUALITY SUMMARY ==================
  batch_quality_summary:
    system:
      template: |
        You are a cybersecurity data quality analyst specializing in analyzing batch validation results to provide strategic insights for synthetic data generation improvement.

        Your task is to analyze multi-dimensional validation results across a batch of seed examples and provide:

        1. **Quality Trend Analysis**: Patterns in quality scores across dimensions
        2. **Common Issues Identification**: Recurring problems affecting quality
        3. **Improvement Recommendations**: Strategic suggestions for enhancement
        4. **Domain-Specific Insights**: Cybersecurity-specific observations
        5. **Generation Strategy Optimization**: Recommendations for better synthesis

        Focus on actionable intelligence that can improve future seed generation quality.

    user:
      template: |
        Analyze the following batch validation results and provide strategic quality insights:

        **Batch Validation Data:**
        {batch_validation_json}

        **QUALITY ANALYSIS REQUIREMENTS:**

        Provide comprehensive batch analysis in this exact JSON structure:

        {{
          "batch_overview": {{
            "total_examples": 0,
            "high_quality_count": 0,
            "overall_quality_rate": 0.0,
            "average_composite_score": 0.0,
            "quality_distribution": "description of score distribution"
          }},
          "dimension_analysis": {{
            "strongest_dimension": "dimension with highest average scores",
            "weakest_dimension": "dimension with lowest average scores",
            "dimension_correlations": ["observed correlations between dimensions"],
            "improvement_priorities": ["dimensions requiring most attention"]
          }},
          "pattern_identification": {{
            "quality_patterns": ["recurring quality patterns observed"],
            "common_failure_modes": ["most frequent failure types"],
            "success_characteristics": ["characteristics of high-quality examples"],
            "domain_specific_trends": ["cybersecurity-specific trends"]
          }},
          "strategic_recommendations": {{
            "immediate_improvements": ["actionable improvements for next generation"],
            "domain_knowledge_enhancements": ["domain discovery/context improvements needed"],
            "generation_parameter_tuning": ["suggested parameter adjustments"],
            "quality_threshold_recommendations": ["threshold adjustment suggestions"]
          }},
          "sample_type_analysis": {{
            "malicious_quality_trends": "quality trends for malicious examples",
            "benign_quality_trends": "quality trends for benign examples",
            "type_specific_recommendations": ["recommendations by sample type"]
          }}
        }}

        **ANALYSIS INSTRUCTIONS:**
        1. Identify systematic quality patterns across the batch
        2. Correlate quality issues with specific generation approaches
        3. Provide actionable recommendations for quality improvement
        4. Consider cybersecurity domain-specific factors
        5. Suggest optimization strategies for future generation

        Return ONLY valid JSON with strategic batch quality analysis.
      
      variables:
        - batch_validation_json

  # ================== ADAPTIVE SELECTION GUIDANCE ==================
  adaptive_selection:
    system:
      template: |
        You are a machine learning data curation expert specializing in adaptive seed selection for cybersecurity synthetic data generation.

        Your task is to provide intelligent guidance for selecting optimal seed examples based on:

        1. **Quality-Weighted Selection**: Prioritize high-quality examples
        2. **Diversity Maximization**: Ensure broad coverage of feature space
        3. **Class Balance Optimization**: Maintain appropriate malicious/benign ratios
        4. **Domain Coverage**: Ensure comprehensive attack vector representation
        5. **Training Effectiveness**: Select seeds that will produce effective training data

        Focus on creating a diverse, high-quality seed pool that maximizes synthetic data generation effectiveness.

    user:
      template: |
        Provide adaptive selection guidance for this validated seed pool:

        **Selection Context:**
        {selection_context_json}

        **SELECTION GUIDANCE REQUIREMENTS:**

        Provide selection strategy in this exact JSON structure:

        {{
          "selection_strategy": {{
            "recommended_approach": "recommended selection methodology",
            "target_seed_count": 0,
            "quality_threshold": 0.0,
            "diversity_emphasis": "high/medium/low"
          }},
          "quality_prioritization": {{
            "minimum_composite_score": 0.0,
            "dimension_priorities": ["dimensions to prioritize in selection"],
            "quality_weight": 0.0-1.0,
            "diversity_weight": 0.0-1.0
          }},
          "diversity_optimization": {{
            "diversity_metrics": ["metrics for measuring diversity"],
            "coverage_requirements": ["areas requiring coverage"],
            "redundancy_threshold": 0.0-1.0,
            "novelty_emphasis": "strategy for emphasizing novel examples"
          }},
          "domain_considerations": {{
            "attack_vector_coverage": ["attack vectors to ensure coverage"],
            "threat_sophistication_balance": "strategy for balancing sophistication levels",
            "realistic_scenario_emphasis": "emphasis on realistic scenarios",
            "technical_accuracy_requirements": "technical accuracy requirements"
          }},
          "selection_recommendations": [
            "specific recommendation 1 for seed selection",
            "specific recommendation 2 for seed selection",
            "specific recommendation 3 for seed selection"
          ]
        }}

        **SELECTION INSTRUCTIONS:**
        1. Balance quality and diversity considerations
        2. Ensure comprehensive domain coverage
        3. Optimize for effective synthetic data generation
        4. Consider downstream training effectiveness
        5. Maintain cybersecurity domain authenticity

        Return ONLY valid JSON with adaptive selection guidance.
      
      variables:
        - selection_context_json