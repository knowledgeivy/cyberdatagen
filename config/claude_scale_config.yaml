version: "2.2-claude"
description: "Configuration for Claude 3.5 Haiku scale generation, parallel validation, and seed validation"
author: "CyberData Team"
last_updated: "2025-10-10"

# Scale Generation Configuration (Claude-specific)
scale_generation:
  # Default generation parameters
  defaults:
    scale_count: 1100
    malicious_ratio: 0.5
    max_workers: 10  # Adjusted for Claude API rate limits
    batch_size: 5    # Adjusted for Claude context handling

  # Performance settings (Claude-optimized)
  performance:
    api_delay: 0.3  # Slightly higher delay for Claude API
    retry_attempts: 3
    retry_delay: 2
    timeout: 300  # 5 minutes per batch

  # Quality control
  quality_control:
    duplicate_similarity_threshold: 0.85
    context_integration_required: true
    schema_validation_strict: true

  # Generation parameters by sample type
  sample_types:
    malicious:
      temperature: 0.8
      priority: 2
      diversity_emphasis: high
    benign:
      temperature: 0.8
      priority: 1
      diversity_emphasis: medium

# Scale Validation Configuration
scale_validation:
  # Parallel processing configuration
  parallel_processing:
    max_workers: 10  # Adjusted for Claude
    batch_delay: 0.15  # Slightly longer for Claude
    enable_parallel: true
    worker_timeout: 300

  # Validation strategy
  validation_strategy:
    validate_all_data: true
    fallback_sample_rate: 0.15
    min_samples: 50
    max_samples: null
    confidence_level: 0.95
    intelligent_sampling: true

  # Quality thresholds
  quality_thresholds:
    technical_accuracy: 0.75
    schema_consistency: 0.95
    realism_assessment: 0.70
    semantic_uniqueness: 0.65
    domain_alignment: 0.75
    overall_minimum: 0.75

  # Composite score weighting
  score_weights:
    technical_accuracy: 0.25
    schema_consistency: 0.25
    realism_assessment: 0.20
    semantic_uniqueness: 0.15
    domain_alignment: 0.15

  # Quality tiers
  quality_tiers:
    excellent: 0.9
    good: 0.8
    fair: 0.7
    poor: 0.0

  # Production readiness criteria
  production_readiness:
    minimum_quality_rate: 0.75
    minimum_schema_consistency: 0.95
    minimum_technical_accuracy: 0.75
    recommended_quality_rate: 0.80

  # Performance optimization for parallel validation
  performance_optimization:
    enable_progress_logging: true
    log_every_n_samples: 100
    enable_performance_metrics: true
    track_validation_rate: true
    optimize_memory_usage: true

# Seed Validation Configuration
seed_validation:
  # Parallel processing configuration
  parallel_processing:
    max_workers: 5  # Fewer for Claude seed validation
    batch_delay: 0.2
    enable_parallel: true
    worker_timeout: 300

  # Quality thresholds
  quality_thresholds:
    technical_accuracy: 0.7
    schema_consistency: 0.9
    realism_assessment: 0.7
    semantic_uniqueness: 0.6
    domain_alignment: 0.7
    overall_minimum: 0.75

  # Composite score weighting
  score_weights:
    technical_accuracy: 0.25
    schema_consistency: 0.25
    realism_assessment: 0.20
    semantic_uniqueness: 0.15
    domain_alignment: 0.15

  # Quality tiers
  quality_tiers:
    excellent: 0.9
    good: 0.8
    fair: 0.7
    poor: 0.0

  # Performance optimization
  performance_optimization:
    enable_progress_logging: true
    log_every_n_samples: 25
    enable_performance_metrics: true
    track_validation_rate: true
    optimize_memory_usage: true
    show_eta_estimates: true
    show_quality_metrics: true
    progress_bar_enabled: true

  # Adaptive selection configuration
  adaptive_selection:
    enable_diversity_selection: true
    diversity_weight: 0.3
    similarity_threshold: 0.7
    max_examples_per_selection: null

  # Error handling
  error_handling:
    max_retries: 3
    retry_delay: 2
    continue_on_failure: true
    log_failed_examples: true

# Context Integration Settings
context_integration:
  required_sources:
    - domain_discovery
    - data_info_schema

  optional_sources:
    - contextual_problems
    - attack_taxonomy
    - technical_indicators

  generation_weights:
    domain_discovery: 0.4
    contextual_problems: 0.3
    data_info_schema: 0.2
    seed_examples: 0.1

  context_validation:
    require_domain_discovery: true
    require_schema_info: true
    validate_context_completeness: true

# Statistical Estimation Settings
statistical_estimation:
  sampling:
    method: "stratified_random"
    stratify_by: "sample_type"
    ensure_representation: true

  confidence_intervals:
    quality_estimation: 0.95
    distribution_estimation: 0.90
    production_readiness: 0.95

  extrapolation:
    quality_projection_method: "conservative"
    uncertainty_margin: 0.05
    validation_requirements: strict

# Adaptive Selection Configuration
adaptive_selection:
  strategy:
    primary_criterion: "composite_score"
    secondary_criterion: "diversity"
    balance_sample_types: true

  quality_weighting:
    excellent_weight: 1.0
    good_weight: 0.8
    fair_weight: 0.6
    poor_weight: 0.0

  diversity_optimization:
    similarity_threshold: 0.7
    diversity_weight: 0.3
    uniqueness_emphasis: medium

  quality_prediction:
    method: "type_based_averaging"
    fallback_score: 0.5
    confidence_threshold: 0.7

# Output Configuration
output:
  directories:
    scaled_raw: "data/scaled-raw-claude"
    scaled_validation: "data/scaled_validation-claude"
    scaled_validated: "data/scaled-validated-claude"
    scaled_filtered: "data/scaled-filtered-claude"
    seed_validation: "data/seed_validation-claude"
    seeds_validated: "data/seeds-validated-claude"
    seeds_filtered: "data/seeds-filtered-claude"

  file_naming:
    scale_data: "{nature}_scale_claude.json"
    validation_report: "{nature}_scale_validation_report_claude.json"
    quality_summary: "{nature}_scale_quality_summary_claude.json"
    seed_validation_report: "{nature}_seeds_validation_report_claude.json"
    seed_quality_summary: "{nature}_quality_summary_claude.json"

  metadata:
    include_generation_stats: true
    include_validation_details: true
    include_context_sources: true
    include_quality_metrics: true
    include_performance_metrics: true
    track_processing_time: true
    track_parallel_efficiency: true

# Logging Configuration
logging:
  levels:
    scale_generation: "INFO"
    scale_validation: "INFO"
    seed_validation: "INFO"
    parallel_validation: "INFO"
    context_loading: "INFO"
    quality_assessment: "DEBUG"

  progress_reporting:
    batch_completion: true
    validation_progress: true
    parallel_worker_status: true
    quality_metrics: true
    performance_metrics: true
    detailed_progress_logging: true
    progress_bar_enabled: true
    log_every_n_samples: 50
    show_eta_estimates: true
    show_quality_metrics: true
    seed_validation_progress: true

  performance_tracking:
    generation_rate: true
    validation_rate: true
    parallel_efficiency: true
    worker_utilization: true
    context_loading_time: true
    api_call_metrics: true
    seed_validation_rate: true

# Model Configuration (Claude-specific)
models:
  # Primary model for generation and validation
  primary:
    name: "claude-3-5-haiku-20241022"
    max_tokens: 8192  # Claude 3.5 Haiku max output
    provider: "anthropic"

  # Temperature settings by task
  temperatures:
    scale_generation: 0.8
    scale_validation: 0.0
    seed_validation: 0.0
    context_analysis: 0.3

  # Rate limiting for Claude API
  rate_limiting:
    calls_per_minute: 50  # Conservative for Claude
    burst_allowance: 8
    backoff_strategy: "exponential"
    parallel_request_limit: 6  # Lower for Claude
    adaptive_rate_limiting: true
    seed_validation_limit: 5

# Error Handling
error_handling:
  retry_logic:
    max_retries: 3
    base_delay: 2
    max_delay: 30
    exponential_backoff: true

  failure_thresholds:
    max_batch_failures: 5
    max_validation_failures: 10
    max_worker_failures: 3
    min_success_rate: 0.8
    max_seed_failures: 5

  recovery:
    continue_on_batch_failure: true
    continue_on_worker_failure: true
    reduce_batch_size_on_failure: true
    reduce_workers_on_failure: true
    skip_problematic_samples: true
    continue_on_seed_failure: true

  fallbacks:
    use_simplified_prompts: true
    reduce_context_complexity: true
    switch_to_sequential_mode: true
    lower_quality_thresholds: false

# Validation Enhancement Settings
validation_enhancements:
  multi_dimensional:
    enabled: true
    dimensions: 5
    comprehensive_analysis: true

  parallel_enhancements:
    enabled: true
    intelligent_task_distribution: true
    dynamic_worker_scaling: false
    load_balancing: true

  intelligent_sampling:
    enabled: true
    stratification: true
    representation_analysis: true

  quality_prediction:
    enabled: true
    prediction_confidence: 0.7
    type_based_analysis: true

  production_assessment:
    enabled: true
    deployment_readiness: true
    operational_analysis: true
    comprehensive_coverage_analysis: true

# Performance Optimization
performance_optimization:
  parallelization:
    enable_parallel_generation: true
    enable_parallel_validation: true
    enable_parallel_seed_validation: true
    thread_pool_optimization: true
    worker_timeout_handling: true

  memory_management:
    batch_processing: true
    context_caching: true
    result_streaming: true
    parallel_memory_optimization: true

  caching:
    context_caching: true
    validation_caching: false
    result_caching: true

  api_optimization:
    request_pooling: true
    connection_reuse: true
    adaptive_timeouts: true
    batch_request_optimization: true

# Parallel Validation Specific Settings
parallel_validation:
  workers:
    default_count: 6  # Lower for Claude
    min_workers: 1
    max_workers: 12
    auto_scaling: false
    seed_validation_count: 5

  task_distribution:
    strategy: "round_robin"
    load_balancing: true
    priority_scheduling: false
    dynamic_rebalancing: false

  performance_tuning:
    batch_delay: 0.15
    seed_batch_delay: 0.2
    worker_timeout: 300
    queue_size: 1000
    memory_limit_per_worker: "512MB"

  monitoring:
    track_worker_performance: true
    measure_throughput: true
    log_bottlenecks: true
    export_metrics: true
    track_seed_validation: true

  quality_assurance:
    cross_validation: false
    result_verification: true
    consistency_checks: true
    error_aggregation: true

# Validation Modes Configuration
validation_modes:
  full_validation:
    enabled: true
    name: "100% Full Validation"
    coverage: 1.0
    parallel_workers: 6
    seed_parallel_workers: 5
    recommended_for: ["production", "research", "comprehensive_analysis"]

  sampling_validation:
    enabled: true
    name: "Statistical Sampling Validation"
    coverage: 0.15
    parallel_workers: 3
    seed_parallel_workers: 2
    recommended_for: ["development", "quick_assessment", "cost_optimization"]

  fast_validation:
    enabled: false
    name: "Fast Validation"
    coverage: 0.05
    parallel_workers: 2
    seed_parallel_workers: 1
    recommended_for: ["debugging", "development"]

# Deployment Configuration
deployment:
  environments:
    development:
      max_workers: 3
      seed_max_workers: 2
      batch_delay: 0.3
      validate_all: false
      sample_rate: 0.1

    testing:
      max_workers: 5
      seed_max_workers: 3
      batch_delay: 0.2
      validate_all: true
      sample_rate: 0.15

    production:
      max_workers: 6
      seed_max_workers: 5
      batch_delay: 0.15
      validate_all: true
      sample_rate: 0.15

  resource_limits:
    max_memory_usage: "4GB"
    max_api_calls_per_hour: 3000  # Conservative for Claude
    max_concurrent_validations: 2
    max_concurrent_seed_validations: 1

  monitoring:
    enable_performance_alerts: true
    performance_threshold: 8  # samples per minute minimum (lower for Claude)
    seed_performance_threshold: 12
    quality_threshold: 0.75
    alert_on_failures: true

# Advanced Features
advanced_features:
  experimental:
    adaptive_worker_scaling: false
    predictive_quality_assessment: false
    cross_dataset_validation: false
    real_time_quality_monitoring: false
    seed_quality_prediction: false

  research:
    detailed_timing_analysis: true
    quality_correlation_analysis: true
    parallel_efficiency_studies: true
    comparative_validation_modes: true
    seed_validation_studies: true
    model_comparison_enabled: true  # For comparing Claude vs GPT

  integration:
    webhook_notifications: false
    external_quality_apis: false
    cloud_validation_services: false
    distributed_validation: false

# Claude-specific settings
claude_specific:
  # API configuration
  api_configuration:
    use_prompt_caching: false  # Not available for Haiku
    use_batch_api: false  # Enable if needed
    streaming: false

  # Model-specific optimizations
  model_optimizations:
    context_window_optimization: true
    response_parsing_strict: true
    retry_on_overload: true

  # Cost tracking
  cost_tracking:
    track_token_usage: true
    estimate_costs: true
    cost_per_million_input: 0.80  # Claude 3.5 Haiku pricing
    cost_per_million_output: 4.00
