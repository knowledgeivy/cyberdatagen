version: "1.0"
description: "Unified configuration for synthetic data generation and prompts"
author: "CyberData Team"
last_updated: "2025-06-07"

# Default generation settings
generation:
  # Default values (user can override via command line or config)
  default_count: 100
  default_malicious_ratio: 0.5
  max_workers: 4
  batch_size: 2
  retry_attempts: 3
  retry_delay: 2  # seconds between retries
  temperature:
    malicious_generation: 0.7
    benign_generation: 0.7
    validation: 0.0

# Duplicate detection configuration
duplicate_detection:
  enabled: true
  check_fields: 
    - "scenario"
    - "technical_data"
    - "indicators"
  
  # Content normalization rules
  normalization:
    lowercase: true
    remove_extra_whitespace: true
    remove_specific_values: true  # Replace IPs, domains with placeholders

# Quality control settings
quality_control:
  validation:
    enabled: true
    sample_rate: 0.1  # Validate 10% of generated samples
    min_score_threshold: 0.7
  
  retry_logic:
    enabled: true
    max_failed_batches: 3
    min_success_rate: 0.8  # 80% of batches must succeed

# Logging configuration
logging:
  level: "INFO"
  detailed_progress: true
  log_generation_metrics: true

# Output configuration
output:
  save_format: "json"
  include_metadata: true
  include_generation_stats: true
  include_duplicate_stats: true

# Prompts for generation
prompts:
  # Main generation prompt for malicious samples from seed examples
  generation:
    system:
      template: |
        You are a cybersecurity synthetic data generator specialized in creating realistic examples. 
        Given seed examples from a cybersecurity dataset, generate additional samples following the exact same schema and structure.
        
        CRITICAL SCHEMA REQUIREMENTS:
        - Preserve the EXACT column names and data types from the seed examples
        - Maintain the same field structure and value patterns
        - Generate data that matches the original dataset's schema perfectly
        - Do not add metadata fields like "sample_type", "nature", "description" unless they exist in the seeds
        
        Your response must be valid JSON format. Do not include any markdown code blocks or explanatory text.
        Return ONLY the JSON object with the structure: {"samples": [...]}.

    user:
      template: |
        Generate {count} additional samples that follow the EXACT same schema as these seed examples:

        Seed Examples:
        {examples_json}

        Requirements:
        1. Use the SAME field names as shown in the seed examples
        2. Generate realistic values that match the data types and patterns
        3. Maintain any existing label encoding (e.g., 1 for malicious, 0 for benign)
        4. Do not add any additional fields beyond what's in the seed examples
        5. Ensure technical accuracy for cybersecurity scenarios
        
        Return ONLY valid JSON with this exact format:
        {{
          "samples": [
            // {count} samples with the same structure as seed examples
          ]
        }}
      
      variables:
        - examples_json
        - count

  # Enhanced generation prompt for schema-preserving real-world data
  schema_preserving_generation:
    system:
      template: |
        You are an expert cybersecurity data generator that specializes in creating synthetic data that perfectly matches real-world dataset schemas.
        
        Your task is to generate synthetic samples that:
        1. Use the EXACT same column names as the original data
        2. Maintain the same data types and value patterns
        3. Preserve the original label encoding
        4. Follow the statistical distributions of the original data
        5. Generate realistic cybersecurity scenarios within the schema constraints
        
        CRITICAL: Do not add any additional fields or metadata. Only use the columns present in the original schema.
        
        Return valid JSON only. No markdown, no explanations.

    user:
      template: |
        Original Schema Information:
        {schema_info}

        Seed Examples:
        {examples_json}

        Generate {count} new samples that:
        - Use the exact same column names: {column_names}
        - Maintain the label encoding: {label_mapping}
        - Follow the same data patterns as the seed examples
        - Are realistic for cybersecurity scenarios

        Return ONLY valid JSON:
        {{
          "samples": [
            // {count} samples with identical schema to seeds
          ]
        }}
      
      variables:
        - schema_info
        - examples_json
        - count
        - column_names
        - label_mapping

  # Prompt for generating benign/legitimate samples with schema preservation
  benign_generation:
    system:
      template: |
        You are a cybersecurity synthetic data generator specialized in creating realistic benign/legitimate activity examples.
        Generate normal, non-malicious activities that follow the exact schema of the provided examples.
        
        CRITICAL SCHEMA REQUIREMENTS:
        - Use the EXACT same field names and structure as the seed examples
        - Maintain the same data types and value patterns
        - Set the label field to indicate benign/legitimate activity
        - Do not add any additional metadata fields
        
        Focus on creating realistic examples of legitimate business operations, normal user behavior, and standard IT activities.
        
        Your response must be valid JSON format. Do not include any markdown code blocks or explanatory text.
        Return ONLY the JSON object with the structure: {"samples": [...]}.

    user:
      template: |
        Generate {count} benign/legitimate activity samples using the same schema as these examples:

        Schema Reference:
        {schema_reference}

        Requirements:
        1. Use the EXACT same field names and structure
        2. Generate legitimate, non-malicious activities
        3. Set appropriate values for the label field to indicate benign activity
        4. Ensure all generated data follows the same patterns and constraints
        5. Include realistic technical details for normal operations
        
        Examples of legitimate activities for this context:
        - Normal user authentication and system access
        - Routine business operations and data processing
        - Standard network traffic and communications
        - Regular system maintenance and updates
        - Typical user behavior patterns

        Return ONLY valid JSON:
        {{
          "samples": [
            // {count} benign samples with identical schema
          ]
        }}
      
      variables:
        - count
        - schema_reference

  # Fallback generation prompt (when seeds are not available)
  backup_generation:
    system:
      template: |
        You are a cybersecurity example generator. Create examples 
        for {nature} attacks in the {area} context. 
        
        CRITICAL: Return valid JSON only. No markdown, no explanations.
        Use format: {{"samples": [...]}}
      
      variables:
        - nature
        - area

    user:
      template: |
        Generate {count} examples of {nature} attacks. 
        Description: {description}
        
        Return ONLY a JSON object with a 'samples' array.
        No markdown formatting or explanatory text.
        
        Expected format:
        {{
          "samples": [
            {{
              "scenario": "attack description",
              "technical_data": "technical details",
              "indicators": ["indicator1", "indicator2"],
              "detection_method": "detection approach"
            }}
          ]
        }}
      
      variables:
        - count
        - nature
        - description

metadata:
  models:
    - name: "gpt-4.1-mini"
      max_tokens: 16384
      temperature:
        generation: 0.7
        validation: 0.0