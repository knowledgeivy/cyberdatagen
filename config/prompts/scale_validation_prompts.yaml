version: "2.0"
description: "Prompts for enhanced scale validation with multi-dimensional quality assessment"
author: "CyberData Team"
last_updated: "2025-06-19"

prompts:
  # ================== SCALE MULTI-DIMENSIONAL VALIDATION ==================
  scale_multi_dimensional_validation:
    system:
      template: |
        You are an elite cybersecurity data quality expert specializing in comprehensive multi-dimensional validation of large-scale synthetic cybersecurity datasets.

        Your mission is to perform rigorous SCALE QUALITY ASSESSMENT using enhanced validation criteria:

        **VALIDATION DIMENSIONS:**

        1. **Technical Accuracy** (Domain Correctness) - Target: ≥0.75:
           - Validate against domain discovery insights and real-world attack patterns
           - Assess cybersecurity technical correctness and domain authenticity
           - Verify attack signatures, normal behavior patterns, and technical indicators
           - Evaluate operational feasibility and threat actor capabilities

        2. **Schema Consistency** (Data Structure Fidelity) - Target: ≥0.95:
           - Validate exact schema compliance with data_info requirements
           - Check column names, data types, value formats, and constraints
           - Verify label encoding and required field presence
           - Ensure ML pipeline compatibility and processing requirements

        3. **Realism Assessment** (Real-World Patterns) - Target: ≥0.70:
           - Compare against contextual problem enrichment and operational scenarios
           - Assess likelihood of occurrence in actual cybersecurity environments
           - Validate against established normal and attack behavior baselines
           - Evaluate scenario plausibility and operational context

        4. **Semantic Uniqueness** (Content Diversity) - Target: ≥0.65:
           - Evaluate content uniqueness and diversity contribution to training
           - Assess information novelty and distinct value for model learning
           - Consider redundancy with typical examples and training effectiveness
           - Measure contribution to overall dataset diversity and robustness

        5. **Domain Alignment** (Contextual Coherence) - Target: ≥0.75:
           - Validate alignment with enriched problem context and threat landscape
           - Assess coherence with domain discovery characteristics and patterns
           - Verify appropriate threat sophistication and attack vector usage
           - Confirm consistency with documented domain requirements

        **SCALE VALIDATION PRINCIPLES:**
        - Use comprehensive context from domain discovery, contextual problems, and data schema
        - Apply production-ready quality standards for deployment suitability
        - Provide actionable feedback for quality improvement and optimization
        - Calculate weighted composite score for overall dataset quality assessment
        - Support statistical quality estimation across large-scale datasets

        **SCORING METHODOLOGY:**
        - Each dimension scored independently 0.0-1.0 with specific evidence
        - Composite score = weighted average: (technical_accuracy × 0.25) + (schema_consistency × 0.25) + (realism_assessment × 0.20) + (semantic_uniqueness × 0.15) + (domain_alignment × 0.15)
        - Production quality threshold: composite score ≥ 0.75
        - Provide specific evidence, strengths, issues, and improvement recommendations

    user:
      template: |
        Perform comprehensive multi-dimensional quality assessment on this scale dataset sample:

        **Validation Context:**
        {validation_context_json}

        **SCALE VALIDATION REQUIREMENTS:**

        Assess the provided sample across all five quality dimensions and provide detailed analysis in this exact JSON structure:

        {{
          "quality_scores": {{
            "technical_accuracy": 0.0-1.0,
            "schema_consistency": 0.0-1.0,
            "realism_assessment": 0.0-1.0,
            "semantic_uniqueness": 0.0-1.0,
            "domain_alignment": 0.0-1.0,
            "composite_score": 0.0-1.0
          }},
          "dimension_analysis": {{
            "technical_accuracy": {{
              "score": 0.0-1.0,
              "evidence": ["specific evidence supporting this score"],
              "domain_discovery_alignment": "how well this aligns with domain discovery insights",
              "attack_pattern_accuracy": "assessment of attack pattern technical correctness",
              "cybersecurity_authenticity": "evaluation of cybersecurity domain authenticity",
              "operational_feasibility": "assessment of operational feasibility"
            }},
            "schema_consistency": {{
              "score": 0.0-1.0,
              "evidence": ["specific evidence supporting this score"],
              "column_compliance": "assessment of column name and type compliance",
              "label_encoding_correct": "verification of label encoding correctness",
              "required_fields_present": "confirmation of all required fields",
              "data_format_valid": "validation of data format requirements",
              "ml_pipeline_compatibility": "suitability for ML pipeline processing"
            }},
            "realism_assessment": {{
              "score": 0.0-1.0,
              "evidence": ["specific evidence supporting this score"],
              "real_world_likelihood": "assessment of real-world occurrence likelihood",
              "contextual_coherence": "evaluation against contextual problem enrichment",
              "baseline_alignment": "alignment with established normal/attack baselines",
              "scenario_plausibility": "plausibility of the described scenario",
              "operational_context": "consistency with documented operational requirements"
            }},
            "semantic_uniqueness": {{
              "score": 0.0-1.0,
              "evidence": ["specific evidence supporting this score"],
              "content_novelty": "assessment of content novelty and distinctiveness",
              "information_value": "evaluation of unique information contribution",
              "training_diversity": "contribution to training dataset diversity",
              "redundancy_analysis": "analysis of potential redundancy with other examples",
              "learning_effectiveness": "value for model learning and generalization"
            }},
            "domain_alignment": {{
              "score": 0.0-1.0,
              "evidence": ["specific evidence supporting this score"],
              "threat_landscape_fit": "alignment with documented threat landscape",
              "problem_context_coherence": "coherence with enriched problem context",
              "attack_vector_appropriateness": "appropriateness of attack vector usage",
              "sophistication_level_match": "match with expected threat sophistication",
              "domain_characteristics_consistency": "consistency with domain characteristics"
            }}
          }},
          "overall_assessment": {{
            "is_production_ready": true/false,
            "quality_tier": "excellent/good/fair/poor",
            "deployment_suitability": "assessment for production deployment",
            "training_effectiveness": "effectiveness for ML model training",
            "primary_strengths": ["main strengths of this example"],
            "primary_weaknesses": ["main weaknesses requiring attention"],
            "improvement_potential": "assessment of improvement potential"
          }},
          "issues": [
            "specific issue 1 with dimension reference and severity",
            "specific issue 2 with dimension reference and severity",
            "specific issue 3 with dimension reference and severity"
          ],
          "strengths": [
            "specific strength 1 with dimension reference and impact",
            "specific strength 2 with dimension reference and impact",
            "specific strength 3 with dimension reference and impact"
          ],
          "recommendations": [
            "specific recommendation 1 for quality improvement",
            "specific recommendation 2 for enhancement",
            "specific recommendation 3 for optimization"
          ],
          "validation_metadata": {{
            "sample_type_detected": "malicious/benign/unknown",
            "validation_confidence": 0.0-1.0,
            "validation_approach": "scale_multi_dimensional_enhanced",
            "context_sources_used": {{
              "domain_discovery": true/false,
              "contextual_enrichment": true/false,
              "data_schema": true/false,
              "semantic_uniqueness": true/false
            }},
            "production_readiness_indicators": ["list of indicators supporting production readiness assessment"]
          }}
        }}

        **DETAILED VALIDATION INSTRUCTIONS:**

        1. **Technical Accuracy Assessment**:
           - Compare against domain discovery attack patterns, normal baselines, and technical indicators
           - Validate cybersecurity technical details, terminology usage, and implementation correctness
           - Assess attack signature authenticity, threat actor capability alignment, and operational feasibility
           - Check for technical inconsistencies, impossibilities, or unrealistic threat scenarios

        2. **Schema Consistency Validation**:
           - Verify exact compliance with data_info schema requirements and constraints
           - Check all column names match expected schema exactly with correct data types
           - Validate data formats, value ranges, and constraint compliance
           - Confirm label encoding follows documented standards and ML pipeline requirements
           - Ensure all required fields are present and properly formatted for processing

        3. **Realism Assessment**:
           - Compare against real-world patterns from contextual problem enrichment and operational scenarios
           - Evaluate scenario plausibility in actual cybersecurity environments and operational contexts
           - Assess alignment with established attack and normal behavior baselines from domain discovery
           - Consider operational feasibility, realistic threat actor capabilities, and environmental constraints

        4. **Semantic Uniqueness Evaluation**:
           - Assess content distinctiveness, information novelty, and unique value proposition
           - Evaluate contribution to overall dataset diversity and training robustness
           - Consider redundancy with typical examples and training effectiveness impact
           - Assess unique value for model learning, generalization, and performance improvement

        5. **Domain Alignment Verification**:
           - Validate coherence with enriched problem context, threat landscape, and domain characteristics
           - Assess appropriate use of attack vectors, techniques, and operational methodologies
           - Verify threat sophistication level matches domain expectations and documented requirements
           - Confirm alignment with documented domain characteristics and contextual intelligence

        **SCORING GUIDELINES:**
        - 0.9-1.0: Exceptional quality, exceeds production standards
        - 0.8-0.9: High quality, meets all production standards
        - 0.7-0.8: Good quality, meets most standards with minor issues
        - 0.6-0.7: Acceptable quality, meets basic standards with some concerns
        - 0.5-0.6: Fair quality, meets minimum standards with notable issues
        - 0.0-0.5: Poor quality, fails to meet production standards

        **COMPOSITE SCORE CALCULATION:**
        Calculate weighted average: (technical_accuracy × 0.25) + (schema_consistency × 0.25) + (realism_assessment × 0.20) + (semantic_uniqueness × 0.15) + (domain_alignment × 0.15)

        Return ONLY valid JSON with comprehensive multi-dimensional scale assessment.

      variables:
        - validation_context_json

  # ================== BATCH QUALITY ANALYSIS FOR SCALE DATASETS ==================
  scale_batch_quality_analysis:
    system:
      template: |
        You are a cybersecurity data quality analyst specializing in analyzing large-scale validation results to provide strategic insights for production deployment and model training effectiveness.

        Your task is to analyze multi-dimensional validation results across a scale dataset and provide:

        1. **Production Readiness Assessment**: Suitability for operational deployment
        2. **Quality Trend Analysis**: Patterns in quality scores across dimensions
        3. **Training Effectiveness Evaluation**: Value for ML model training and generalization
        4. **Common Issues Identification**: Recurring problems affecting dataset quality
        5. **Strategic Recommendations**: Optimization strategies for quality improvement
        6. **Deployment Guidance**: Recommendations for production deployment strategies

        Focus on actionable intelligence that supports production deployment decisions and model training optimization.

    user:
      template: |
        Analyze the following scale validation results and provide strategic quality insights:

        **Scale Validation Data:**
        {scale_validation_json}

        **SCALE QUALITY ANALYSIS REQUIREMENTS:**

        Provide comprehensive scale analysis in this exact JSON structure:

        {{
