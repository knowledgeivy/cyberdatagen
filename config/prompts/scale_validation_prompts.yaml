            "total_samples": 0,
            "samples_validated": 0,
            "validation_coverage": "percentage",
            "estimated_high_quality_total": 0,
            "overall_quality_rate": 0.0,
            "average_composite_score": 0.0,
            "production_readiness_score": 0.0,
            "quality_distribution": "description of score distribution across excellence tiers"
          }},
          "dimension_analysis": {{
            "strongest_dimension": "dimension with highest average scores",
            "weakest_dimension": "dimension with lowest average scores",
            "dimension_correlations": ["observed correlations between dimensions"],
            "improvement_priorities": ["dimensions requiring most attention for optimization"],
            "production_critical_dimensions": ["dimensions most critical for production deployment"]
          }},
          "pattern_identification": {{
            "quality_patterns": ["recurring quality patterns observed across samples"],
            "common_failure_modes": ["most frequent failure types and their characteristics"],
            "success_characteristics": ["characteristics of high-quality examples"],
            "domain_specific_trends": ["cybersecurity-specific trends and patterns"],
            "scale_specific_observations": ["observations specific to large-scale generation"]
          }},
          "production_assessment": {{
            "deployment_readiness": "assessment of readiness for production deployment",
            "recommended_deployment_strategy": "suggested approach for production deployment",
            "risk_mitigation_strategies": ["strategies to mitigate identified quality risks"],
            "monitoring_recommendations": ["recommendations for production monitoring"],
            "quality_assurance_requirements": ["QA requirements for production deployment"]
          }},
          "training_effectiveness": {{
            "model_training_suitability": "assessment for ML model training effectiveness",
            "diversity_adequacy": "evaluation of dataset diversity for robust training",
            "class_balance_implications": ["implications of sample distribution for training"],
            "generalization_potential": "potential for model generalization and robustness",
            "training_optimization_recommendations": ["recommendations for optimizing training effectiveness"]
          }},
          "strategic_recommendations": {{
            "immediate_improvements": ["actionable improvements for immediate implementation"],
            "domain_knowledge_enhancements": ["domain discovery/context improvements needed"],
            "generation_parameter_tuning": ["suggested parameter adjustments for future generation"],
            "quality_threshold_recommendations": ["threshold adjustment suggestions"],
            "validation_process_improvements": ["improvements to validation methodology"]
          }},
          "sample_type_analysis": {{
            "malicious_quality_trends": "quality trends and patterns for malicious examples",
            "benign_quality_trends": "quality trends and patterns for benign examples",
            "type_specific_recommendations": ["recommendations by sample type"],
            "balance_optimization": "recommendations for optimizing sample type balance"
          }},
          "scale_performance_metrics": {{
            "validation_efficiency": "assessment of validation process efficiency",
            "quality_prediction_accuracy": "accuracy of quality estimation methods",
            "sampling_effectiveness": "effectiveness of intelligent sampling strategy",
            "statistical_confidence": "confidence in quality estimates and projections"
          }}
        }}

        **ANALYSIS INSTRUCTIONS:**
        1. Identify systematic quality patterns and trends across the scale dataset
        2. Correlate quality issues with generation approaches and context utilization
        3. Provide actionable recommendations for production deployment readiness
        4. Consider cybersecurity domain-specific factors and operational requirements
        5. Suggest optimization strategies for future large-scale generation
        6. Assess statistical confidence in quality estimates and projections

        Return ONLY valid JSON with strategic scale quality analysis.

      variables:
        - scale_validation_json

  # ================== PRODUCTION DEPLOYMENT ASSESSMENT ==================
  production_deployment_assessment:
    system:
      template: |
        You are a cybersecurity ML deployment specialist responsible for assessing the production readiness of large-scale synthetic datasets.

        Your task is to evaluate whether a scale dataset meets the requirements for:
        1. **Operational Deployment**: Real-world cybersecurity system integration
        2. **Model Training**: Effective ML model development and optimization
        3. **Performance Validation**: Reliable model evaluation and testing
        4. **Quality Assurance**: Ongoing monitoring and quality maintenance

        Focus on practical deployment considerations, operational risks, and performance implications.

    user:
      template: |
        Assess the production deployment readiness of this scale dataset:

        **Deployment Assessment Context:**
        {deployment_context_json}

        **PRODUCTION READINESS ASSESSMENT:**

        Provide deployment assessment in this exact JSON structure:

        {{
          "deployment_readiness": {{
            "overall_readiness_score": 0.0-1.0,
            "readiness_level": "production_ready/conditional_ready/development_only/not_ready",
            "confidence_level": "high/medium/low",
            "deployment_recommendation": "specific deployment recommendation"
          }},
          "operational_assessment": {{
            "system_integration_readiness": "assessment for operational system integration",
            "data_pipeline_compatibility": "compatibility with existing data pipelines",
            "performance_implications": ["expected performance impacts and considerations"],
            "operational_risks": ["identified operational risks and mitigation strategies"],
            "monitoring_requirements": ["requirements for operational monitoring"]
          }},
          "model_training_assessment": {{
            "training_effectiveness": "assessment for ML model training",
            "data_quality_sufficiency": "sufficiency of data quality for training",
            "diversity_adequacy": "adequacy of diversity for robust model development",
            "generalization_potential": "potential for model generalization",
            "training_recommendations": ["specific training recommendations and optimizations"]
          }},
          "quality_assurance": {{
            "qa_requirements": ["quality assurance requirements for deployment"],
            "monitoring_metrics": ["metrics for ongoing quality monitoring"],
